# Ethora frontend image: static SPA serving. Used when the container serves
# itself (CMD "serve"); host-nginx installs use CMD "export" instead and keep
# their own server block (deploy/nginx/web.conf.template).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Runtime config and the entry document must never be cached: they are
    # what changes between deploys of the same bundle.
    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
    # Hashed assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
