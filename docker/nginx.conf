# Ethora frontend image: static SPA serving. Used when the container serves
# itself (CMD "serve"); host-nginx installs use CMD "export" instead and keep
# their own server block (deploy/nginx/web.conf.template).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Runtime config and the entry document must never be cached: they are
    # what changes between deploys of the same bundle.
    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate";
    }
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
    # Universal links / app links for the mobile app (/call/*), rendered by the
    # entrypoint. The Apple file has no extension, so it needs an explicit JSON
    # type, and neither may fall through to the SPA's index.html or redirect:
    # a missing file is a plain 404.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
    }
    # The AI widget embed bundle. Snippets hand out /widget/assistant.js; older
    # builds handed out /widget/assistant-<hash>.js and deleted it on the next
    # build. Any such name that is gone answers with the current bundle, so
    # the sites that embedded it keep working. Short cache: a new build must
    # reach visitors within minutes.
    location ~ ^/widget/assistant(-[A-Za-z0-9_.-]+)?\.js$ {
        try_files $uri /widget/assistant.js =404;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=300";
    }
    # Hashed assets are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # "Try it on your site" demo pages (pages/Try): their address carries a
    # token, so no referrer leaves the page; never cached, not indexed.
    # try.html is index.html whose CSP may frame any https site (the demo
    # frames the named website); index.html is the fallback for older builds.
    location ^~ /try/ {
        try_files /try.html /index.html =404;
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer";
        add_header X-Robots-Tag "noindex, nofollow";
    }
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
