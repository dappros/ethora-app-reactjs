name: Deploy to Server (dev)

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings=100

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  deploy_push:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}
            git fetch --all --prune
            git checkout dev || git checkout -b dev
            # Force sync local dev to remote state to avoid divergence issues
            git reset --hard origin/dev
            git clean -fd
            # Install devDependencies too (vite/ts), build static assets
            npm ci --silent --no-audit --no-fund
            npm run build
            export NODE_ENV=production
            if command -v pm2 >/dev/null 2>&1; then
              # Stop dev server if it is running
              pm2 delete ethora-dev || true
              # Serve built dist on 5173 (SPA mode) under pm2
              pm2 delete ethora-static || true
              pm2 serve dist 5173 --name ethora-static --spa
              pm2 save || true
            fi

