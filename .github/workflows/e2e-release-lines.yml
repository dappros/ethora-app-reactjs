name: E2E (release lines)

# Browser tests on pull requests into a release line (2610, 2611, ...). The
# full CI (ci.yml) runs on PRs into dev only and its lint step does not pass on
# the release lines yet; this runs what does: typecheck, build, unit tests and
# the Playwright suite against the Vite dev server with a mocked API.
on:
  pull_request:
    branches:
      - '2[0-9][0-9][0-9]'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # The dev server reads VITE_* at start; the specs mock every API call.
      - name: Env for the dev server
        run: cp .env-example .env

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Browser tests
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
